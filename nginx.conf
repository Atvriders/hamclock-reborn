user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;

    # cloudflared terminates the visitor's connection and opens a fresh local
    # one, so $remote_addr is the tunnel for every visitor on earth: all four
    # telemetry reports on the live box are stamped with the tunnel's own
    # RFC1918 /24, and telemetryPostLimiter keys on that same address (10/hour,
    # 60/day) -- one shared bucket for everybody. Cloudflare overwrites
    # CF-Connecting-IP on ingress, so behind the tunnel it is the visitor and
    # cannot be forged by the visitor.
    #
    # It is unforgeable only behind the tunnel, so honour it only when the peer
    # is one of ours: loopback, RFC1918 or IPv6 ULA covers every way cloudflared
    # can reach this container (same compose network, the host, or another box
    # on the LAN -- the live box's $remote_addr here is an RFC1918 /24). That is
    # deliberately the same trust set as isTrustedProxyAddr() in
    # server/src/server.js, so the two layers agree about who may speak for
    # someone else. An IPv4 caller from anywhere else -- which is the whole
    # internet for an install that publishes 3012 without Cloudflare in front --
    # gets $remote_addr exactly as before and cannot pick its own rate-limit
    # bucket. IPv6 is the gap: Docker's userland proxy carries it to this
    # IPv4-only listener and re-dials from the bridge gateway, which is inside
    # the set, so those callers can name themselves -- as they already can at
    # :3013, which compose also publishes and the backend trusts the same way.
    map $remote_addr $cf_claim {
        default                           "";
        "~^127\."                         $http_cf_connecting_ip;
        "~^10\."                          $http_cf_connecting_ip;
        "~^192\.168\."                    $http_cf_connecting_ip;
        "~^172\.(1[6-9]|2[0-9]|3[01])\."  $http_cf_connecting_ip;
        "::1"                             $http_cf_connecting_ip;
        "~*^f[cd][0-9a-f]{2}:"            $http_cf_connecting_ip;
    }

    # Shape gate, not validation -- it keeps a junk value out of the rate-limit
    # key, and rejects the comma-joined string that nginx >= 1.23 (the mainline
    # line the nginx:alpine base tracks) builds from duplicate CF-Connecting-IP
    # headers. clientIp() re-validates.
    map $cf_claim $client_ip {
        default                           $remote_addr;
        "~*^[0-9a-f:][0-9a-f.:]{1,44}$"   $cf_claim;
    }

    server {
        listen 3012;
        server_name _;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /api/ {
            proxy_pass http://backend:3013;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            # Not $proxy_add_x_forwarded_for: the receiver reads only the first
            # hop of this header, and that slot would hold whatever XFF the
            # caller chose to send.
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
